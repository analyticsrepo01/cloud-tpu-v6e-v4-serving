[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-tpu-vllm-serving"
version = "1.0.0"
description = "Production-grade LLM serving infrastructure on Google Cloud TPU v6e (Trillium) and TPU v4 with vLLM and Vertex AI"
readme = "README.md"
authors = [
    { name = "Cloud & AI Infrastructure Engineer" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "google-cloud-aiplatform>=1.64.0",
    "google-cloud-storage>=2.14.0",
    "pydantic>=2.5.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    "matplotlib>=3.8.0",
    "ruff>=0.3.0",
]

[project.scripts]
tpu-serve = "tpu_serving.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
